<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat WebSocket - Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }
        
        .auth-section, .chat-section {
            padding: 30px;
        }
        
        .auth-section {
            text-align: center;
        }
        
        .auth-section h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .auth-tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .auth-tabs button.active {
            background: #667eea;
            color: white;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .auth-form input {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .auth-form input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .auth-form button {
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .auth-form button:hover {
            background: #5568d3;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .success {
            background: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .chat-section {
            display: none;
        }
        
        .chat-section.active {
            display: block;
        }
        
        .chat-header {
            background: #667eea;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-header h2 {
            font-size: 20px;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .status {
            padding: 10px 30px;
            background: #f0f0f0;
            font-size: 14px;
            color: #666;
        }
        
        .status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        #messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px 30px;
            background: #fafafa;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .sender {
            font-weight: 600;
            color: #667eea;
        }
        
        .time {
            font-size: 12px;
            color: #999;
        }
        
        .content {
            color: #333;
        }
        
        .system-message {
            text-align: center;
            color: #999;
            font-size: 14px;
            font-style: italic;
            margin: 10px 0;
        }
        
        .message-input {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
        }
        
        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }
        
        #sendBtn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        #sendBtn:hover {
            background: #5568d3;
        }
        
        #sendBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Section d'authentification -->
        <div class="auth-section" id="authSection">
            <h1>🔐 Authentification</h1>
            
            <div class="auth-tabs">
                <button id="loginTab" class="active" onclick="switchTab('login')">Connexion</button>
                <button id="registerTab" onclick="switchTab('register')">Inscription</button>
            </div>
            
            <div id="authMessage" class="hidden"></div>
            
            <form class="auth-form" id="authForm" onsubmit="handleAuth(event)">
                <input type="text" id="username" placeholder="Nom d'utilisateur" required>
                <input type="password" id="password" placeholder="Mot de passe" required>
                <button type="submit" id="authBtn">Se connecter</button>
            </form>
        </div>
        
        <!-- Section de chat -->
        <div class="chat-section" id="chatSection">
            <div class="chat-header">
                <h2>💬 Chat en temps réel</h2>
                <div>
                    <span id="currentUser"></span>
                    <button class="logout-btn" onclick="logout()">Déconnexion</button>
                </div>
            </div>
            
            <div class="status" id="status">Déconnecté</div>
            
            <div id="messages"></div>
            
            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Tapez votre message..." disabled>
                <button id="sendBtn" onclick="sendMessage()" disabled>Envoyer</button>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let token = null;
        let currentUsername = null;
        let authMode = 'login';
        
        function switchTab(mode) {
            authMode = mode;
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const authBtn = document.getElementById('authBtn');
            
            if (mode === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                authBtn.textContent = 'Se connecter';
            } else {
                loginTab.classList.remove('active');
                registerTab.classList.add('active');
                authBtn.textContent = 'S\'inscrire';
            }
            
            hideMessage();
        }
        
        async function handleAuth(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    token = data.access_token;
                    currentUsername = data.user.username;
                    
                    showMessage(
                        authMode === 'login' ? 'Connexion réussie !' : 'Inscription réussie !',
                        'success'
                    );
                    
                    setTimeout(() => {
                        document.getElementById('authSection').style.display = 'none';
                        document.getElementById('chatSection').classList.add('active');
                        document.getElementById('currentUser').textContent = currentUsername;
                        connectWebSocket();
                    }, 500);
                } else {
                    showMessage(data.message || 'Erreur d\'authentification', 'error');
                }
            } catch (error) {
                showMessage('Erreur de connexion au serveur', 'error');
                console.error('Auth error:', error);
            }
        }
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('authMessage');
            messageDiv.textContent = message;
            messageDiv.className = type;
            messageDiv.classList.remove('hidden');
        }
        
        function hideMessage() {
            const messageDiv = document.getElementById('authMessage');
            messageDiv.classList.add('hidden');
        }
        
        function connectWebSocket() {
            socket = io({
                auth: {
                    token: token
                }
            });
            
            socket.on('connect', () => {
                updateStatus('Connecté', true);
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
            });
            
            socket.on('disconnect', () => {
                updateStatus('Déconnecté', false);
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
            });
            
            socket.on('messageHistory', (messages) => {
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';
                messages.forEach(msg => addMessageToUI(msg));
            });
            
            socket.on('newMessage', (msg) => {
                addMessageToUI(msg);
            });
            
            socket.on('userJoined', (data) => {
                addSystemMessage(`${data.username} a rejoint le chat`);
            });
            
            socket.on('userLeft', (data) => {
                addSystemMessage(`${data.username} a quitté le chat`);
            });
            
            socket.on('connect_error', (error) => {
                console.error('Connection error:', error);
                updateStatus('Erreur de connexion', false);
            });
        }
        
        function updateStatus(text, connected) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = text;
            statusDiv.className = connected ? 'status connected' : 'status';
        }
        
        function addMessageToUI(msg) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            
            const time = new Date(msg.sentAt).toLocaleTimeString('fr-FR', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span class="sender">${msg.sender}</span>
                    <span class="time">${time}</span>
                </div>
                <div class="content">${escapeHtml(msg.content)}</div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function addSystemMessage(text) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'system-message';
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (content === '') return;
            
            socket.emit('sendMessage', { content }, (response) => {
                if (response.success) {
                    input.value = '';
                } else {
                    alert('Erreur: ' + response.error);
                }
            });
        }
        
        function logout() {
            if (socket) {
                socket.disconnect();
            }
            
            token = null;
            currentUsername = null;
            
            document.getElementById('chatSection').classList.remove('active');
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('messages').innerHTML = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            hideMessage();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Permettre l'envoi avec Enter
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
