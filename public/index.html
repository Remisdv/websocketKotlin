<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat WebSocket NestJS</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #1a1a2e; 
      color: #eee; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
    }
    header { 
      background: #16213e; 
      padding: 15px 20px; 
      border-bottom: 2px solid #0f3460;
    }
    header h1 { font-size: 1.5rem; color: #e94560; }
    #login-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #login-form {
      background: #16213e;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
    }
    #login-form h2 { margin-bottom: 20px; }
    #login-form input {
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
      width: 200px;
    }
    #login-form button {
      padding: 12px 25px;
      font-size: 1rem;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #login-form button:hover { background: #c73e54; }
    #chat-container { 
      flex: 1; 
      display: none; 
      flex-direction: column; 
    }
    #messages { 
      flex: 1; 
      overflow-y: auto; 
      padding: 20px;
      background: #1a1a2e;
    }
    .message { 
      margin-bottom: 15px; 
      padding: 12px 15px;
      background: #16213e;
      border-radius: 8px;
      max-width: 70%;
    }
    .message.own { 
      background: #0f3460; 
      margin-left: auto; 
    }
    .message .meta { 
      font-size: 0.75rem; 
      color: #888; 
      margin-bottom: 5px;
    }
    .message .meta .username { 
      color: #e94560; 
      font-weight: bold; 
    }
    .message .content { font-size: 1rem; }
    .system-message {
      text-align: center;
      color: #888;
      font-size: 0.85rem;
      margin: 10px 0;
    }
    #message-form { 
      display: flex; 
      padding: 15px; 
      background: #16213e;
      border-top: 2px solid #0f3460;
    }
    #message-input { 
      flex: 1; 
      padding: 12px 15px; 
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
      background: #1a1a2e;
      color: #eee;
    }
    #message-form button { 
      padding: 12px 25px; 
      font-size: 1rem;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #message-form button:hover { background: #c73e54; }
    #status { 
      padding: 5px 20px; 
      background: #0f3460;
      font-size: 0.85rem;
    }
    #status.connected { color: #4ade80; }
    #status.disconnected { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <h1>💬 Chat WebSocket NestJS</h1>
  </header>

  <div id="login-container">
    <div id="login-form">
      <h2>Rejoindre le chat</h2>
      <input type="text" id="username-input" placeholder="Votre nom..." autofocus>
      <button onclick="joinChat()">Rejoindre</button>
    </div>
  </div>

  <div id="chat-container">
    <div id="status" class="disconnected">Déconnecté</div>
    <div id="messages"></div>
    <form id="message-form" onsubmit="sendMessage(event)">
      <input type="text" id="message-input" placeholder="Tapez votre message..." autocomplete="off">
      <button type="submit">Envoyer</button>
    </form>
  </div>

  <script>
    let socket;
    let currentUsername;

    function joinChat() {
      const usernameInput = document.getElementById('username-input');
      const username = usernameInput.value.trim();
      
      if (!username) {
        alert('Veuillez entrer un nom');
        return;
      }

      currentUsername = username;
      
      // Connexion au serveur WebSocket
      socket = io('http://localhost:3000');

      socket.on('connect', () => {
        document.getElementById('status').textContent = 'Connecté';
        document.getElementById('status').className = 'connected';
        
        // Rejoindre avec le nom d'utilisateur
        socket.emit('join', { username }, (response) => {
          if (response.success) {
            console.log('Joined as:', response.username);
          }
        });
      });

      socket.on('disconnect', () => {
        document.getElementById('status').textContent = 'Déconnecté';
        document.getElementById('status').className = 'disconnected';
      });

      // Historique des messages
      socket.on('messageHistory', (messages) => {
        const messagesDiv = document.getElementById('messages');
        messages.forEach(msg => addMessage(msg));
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });

      // Nouveau message
      socket.on('newMessage', (msg) => {
        addMessage(msg);
        const messagesDiv = document.getElementById('messages');
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });

      // Utilisateur rejoint
      socket.on('userJoined', (data) => {
        addSystemMessage(`${data.username} a rejoint le chat`);
      });

      // Utilisateur parti
      socket.on('userLeft', (data) => {
        addSystemMessage(`${data.username} a quitté le chat`);
      });

      // Afficher le chat
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('chat-container').style.display = 'flex';
      document.getElementById('message-input').focus();
    }

    function addMessage(msg) {
      const messagesDiv = document.getElementById('messages');
      const isOwn = msg.sender === currentUsername;
      
      const messageEl = document.createElement('div');
      messageEl.className = 'message' + (isOwn ? ' own' : '');
      
      const date = new Date(msg.sentAt);
      const timeStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      
      messageEl.innerHTML = `
        <div class="meta">
          <span class="username">${msg.sender}</span> • ${timeStr}
        </div>
        <div class="content">${escapeHtml(msg.content)}</div>
      `;
      
      messagesDiv.appendChild(messageEl);
    }

    function addSystemMessage(text) {
      const messagesDiv = document.getElementById('messages');
      const el = document.createElement('div');
      el.className = 'system-message';
      el.textContent = text;
      messagesDiv.appendChild(el);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage(event) {
      event.preventDefault();
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      
      if (content && socket) {
        socket.emit('sendMessage', { content }, (response) => {
          if (!response.success) {
            alert(response.error);
          }
        });
        input.value = '';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Permettre de rejoindre avec Entrée
    document.getElementById('username-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinChat();
    });
  </script>
</body>
</html>
